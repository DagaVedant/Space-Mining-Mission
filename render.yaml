# Render Blueprint: the game server. The database is hosted outside Render.
services:
  - type: web
    name: asteroid-breaker-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://dagavedant.github.io
      # Postgres on Neon; set in the dashboard, never committed
      - key: DATABASE_URL
        sync: false
