# Render Blueprint: the game server and its database.
services:
  - type: web
    name: asteroid-breaker-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://dagavedant.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: asteroid-breaker-db
          property: connectionString

databases:
  - name: asteroid-breaker-db
    plan: free
    region: virginia
