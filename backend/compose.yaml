services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asteroid
      POSTGRES_PASSWORD: asteroid
      POSTGRES_DB: asteroid
    ports:
      # for running the tests or the app outside Docker
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteroid -d asteroid"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://asteroid:asteroid@db:5432/asteroid
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3001:3001"
    mem_limit: 512m

volumes:
  pgdata:
